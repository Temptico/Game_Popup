# Fly.io config. The app name comes from the FLY_APP_NAME GitHub secret
# (passed as --app by .github/workflows/deploy.yml), so it isn't set here.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # SQLite on the persistent volume below; migrations run on start (npm run docker-start).
  DATABASE_URL = "file:/data/prod.sqlite"

[[mounts]]
  source = "gamediscount_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: webhooks and the storefront app proxy must answer instantly.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

# One small machine: SQLite lives on a single volume, so don't scale horizontally.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
