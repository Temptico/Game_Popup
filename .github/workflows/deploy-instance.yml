name: Deploy instance

# Deploys a private copy of the app (custom distribution) for one store.
# The public App Store app (shopify.app.toml, deploy.yml) is not touched.
#
# Per instance <name> (listed in instances.txt, config in shopify.app.<name>.toml):
#   Fly app:        enigmaplay-<name>   (own SQLite volume)
#   GitHub secrets: SHOPIFY_API_SECRET_<NAME>, SHOPIFY_APP_AUTOMATION_TOKEN_<NAME>
#   Shared secret:  FLY_API_TOKEN
on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Instance name (see instances.txt), e.g. temptico"
        required: true
        type: string

concurrency:
  group: deploy-instance-${{ inputs.instance }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SHOPIFY_CLI_NO_ANALYTICS: "1"
  NAME: ${{ inputs.instance }}
  APP: enigmaplay-${{ inputs.instance }}

jobs:
  checks:
    name: Install, typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:ci.sqlite"
    steps:
      - uses: actions/checkout@v5

      - name: Instance exists
        run: |
          [[ "$NAME" =~ ^[a-z0-9]{2,20}$ ]] || { echo "::error::Invalid instance name '$NAME'"; exit 1; }
          grep -qx "$NAME" instances.txt || { echo "::error::'$NAME' is not in instances.txt"; exit 1; }
          [ -f "shopify.app.$NAME.toml" ] || { echo "::error::shopify.app.$NAME.toml is missing"; exit 1; }
          grep -q '^client_id = "[^"]\+"' "shopify.app.$NAME.toml" || { echo "::error::client_id is empty in shopify.app.$NAME.toml"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: |
          npx prisma generate
          npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Storefront endpoints work on the production server
        run: bash scripts/smoke-proxy.sh

  deploy:
    name: Deploy ${{ inputs.instance }} (Fly.io + Shopify)
    needs: checks
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SHOPIFY_API_SECRET: ${{ secrets[format('SHOPIFY_API_SECRET_{0}', inputs.instance)] }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets[format('SHOPIFY_APP_AUTOMATION_TOKEN_{0}', inputs.instance)] }}
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check required secrets
        run: |
          UPPER=$(echo "$NAME" | tr a-z A-Z)
          missing=0
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::Missing GitHub secret FLY_API_TOKEN"; missing=1; }
          [ -n "$SHOPIFY_API_SECRET" ] || { echo "::error::Missing GitHub secret SHOPIFY_API_SECRET_$UPPER"; missing=1; }
          [ -n "$SHOPIFY_APP_AUTOMATION_TOKEN" ] || { echo "::error::Missing GitHub secret SHOPIFY_APP_AUTOMATION_TOKEN_$UPPER"; missing=1; }
          exit $missing

      - name: Read instance config
        run: |
          CLIENT_ID=$(sed -n 's/^client_id = "\(.*\)"/\1/p' "shopify.app.$NAME.toml")
          SCOPES=$(sed -n 's/^scopes = "\(.*\)"/\1/p' "shopify.app.$NAME.toml")
          echo "CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "SCOPES=$SCOPES" >> "$GITHUB_ENV"
          echo "Instance $NAME → Fly app $APP, scopes: $SCOPES"

      - name: Create Fly app and volume (first run only)
        run: |
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org personal
          fi
          if [ "$(flyctl volumes list --app "$APP" --json | jq 'length')" = "0" ]; then
            flyctl volumes create gamediscount_data --app "$APP" --region fra --size 1 --yes
          fi

      - name: Set runtime secrets (applied with the deploy)
        run: |
          flyctl secrets set --stage --app "$APP" \
            SHOPIFY_API_KEY="$CLIENT_ID" \
            SHOPIFY_API_SECRET="$SHOPIFY_API_SECRET" \
            SCOPES="$SCOPES" \
            SHOPIFY_APP_URL="https://$APP.fly.dev" \
            BILLING_ENABLED="false"

      - name: Deploy server
        run: flyctl deploy --remote-only --app "$APP" --ha=false --wait-timeout 300

      - name: Smoke test
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "https://$APP.fly.dev/"; then echo "App is up"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$APP.fly.dev/ did not respond"; exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Point app config at the instance URL
        run: |
          sed -i "s#https://example.com#https://$APP.fly.dev#g" "shopify.app.$NAME.toml"
          grep -E '^(client_id|name|application_url)|^url|redirect_urls' "shopify.app.$NAME.toml"

      # --allow-updates: add/update config and extensions, never delete anything.
      - name: shopify app deploy
        run: >-
          npx shopify app deploy
          --config "$NAME"
          --allow-updates
          --message "Deploy instance $NAME ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
